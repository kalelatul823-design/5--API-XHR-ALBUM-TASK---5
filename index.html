<head>
    <meta charset="UTF-8">

    <title>XHR ALBUM TASK </title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link

    />
</head>
<body>
    <div class="container">
      <div class="row mt-5">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-body">
                    <form id="albumForm">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" class="form-control" id="title">
                        </div>
                        <div class="form-group">
                            <label for="userId">User Id</label>
                            <select class="form-control" id="userId">
                                <option value="Select UserID">Select UserID</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm btn-block" id="submitBtn">Add Album</button>
                        <button type="button" class="btn btn-primary btn-sm btn-block d-none" id="updateBtn">Update Album</button>
                    </form>
                </div>
            </div>
        </div>
      </div>
